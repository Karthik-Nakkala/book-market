<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Showcase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: rgb(79, 78, 78);
            color: beige;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 0;
        }
        .spacer {
            background-color: black;
            height: 45px;
        }
        main {
            background: linear-gradient(to right, rgb(229, 87, 217), rgb(140, 198, 240));
            padding: 20px;
        }
        main h3 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .books-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
            margin-top: 5%;
        }
        .book {
            perspective: 1000px;
            position: relative;
            width: 215px;
            margin-bottom: 20px;
        }
        .book img {
            width: 100%;
            height: auto;
            transition: transform 2s, opacity 2s;
        }
        .book img:hover {
            transform: rotateY(180deg);
            opacity: 0;
        }
        .book-link {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 2s ease-in-out, visibility 1.3s ease-in-out;
        }
        .book:hover .book-link {
            visibility: visible;
            opacity: 1;
        }
        footer {
            background-color: rgb(87, 85, 85);
            color: white;
            height: 7vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bolder;
        }

        /* Media Queries for Responsive Design */
        @media (max-width: 768px) {
            .books-container {
                flex-direction: column;
                align-items: center;
            }
            .book {
                width: 80%;
                max-width: 240px;
            }
            header {
                font-size: 24px;
            }
            main h3 {
                font-size: 20px;
            }
            .book-link {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        Welcome to Book Showcase
    </header>
    <div class="spacer"></div>
    <main>
        <h3>Explore Books</h3>
        <section>
            <div class="books-container">
                <div class="book">
                    <img src="public/images/mahabharat part-1.jpg" alt="Mahabharat Part 1">
                    <a href="./src/mb-p1.html" class="book-link">Click here</a>
                </div>
                <div class="book">
                    <img src="public/images/mahabharat-1.jpg" alt="Mahabharat">
                    <a href="./src/mb.html" class="book-link">Click here</a>
                </div>
                <div class="book">
                    <img src="public/images/power of sub-con-mind.jpeg" alt="Power of Subconscious Mind">
                    <a href="./src/p-o-s-m.html" class="book-link">Click here</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        © 2025 Book ShowCase | All Rights Reserved
    </footer>
</body>
</html>
